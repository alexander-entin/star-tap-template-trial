<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Tap Trial</title><style>body{margin:0;min-height:100dvh;display:grid;place-content:center;text-align:center;background:#142b50;color:white;font:24px system-ui}button{padding:16px;margin:12px;border-radius:16px;border:0;font:inherit;touch-action:manipulation}#star{background:transparent;color:#ffe13b;font-size:120px}small{font-size:14px}</style><main><h1>Star Tap Trial</h1><p id="score">Score: 0</p><button id="star" aria-label="Tap the star">★</button><br><button id="restart">Restart</button><p><small>Template seed v1</small></p></main><script type="module">let score=0;const display=document.querySelector("#score");document.querySelector("#star").onclick=()=>{display.textContent="Score: "+(++score)};document.querySelector("#restart").onclick=()=>{score=0;display.textContent="Score: 0"};</script></html>
